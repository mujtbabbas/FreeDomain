name: Markdown check
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Lint Markdown files
        run: npx --yes markdownlint-cli2 "**/*.md" "#node_modules"
